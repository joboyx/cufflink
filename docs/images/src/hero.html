<!doctype html>
<!--
  Source of the before and after image: docs/images/hero.png (1280x560, README) and
  docs/store/screenshot-1.png (1280x800, Chrome Web Store; a 700 px or taller viewport adds the caption).
  Rebuild: see "Refresh the README and store images" in CONTRIBUTING.md.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CuffLink before and after</title>
    <style>
      @font-face {
        font-family: 'cufflink Mono';
        src: url('../../../public/fonts/jetbrains-mono-latin-500-normal.woff2') format('woff2');
        font-weight: 500;
      }
      @font-face {
        font-family: 'cufflink Sans';
        src: url('../../../public/fonts/ibm-plex-sans-latin-400-normal.woff2') format('woff2');
        font-weight: 400;
      }
      :root {
        /* Tokyo Night, as in src/lib/theme.ts */
        --night: #1a1b26;
        --night-deep: #16161e;
        --panel: #1f2335;
        --border: #3b4261;
        --fg: #c0caf5;
        --fg2: #a9b1d6;
        --comment: #565f89;
        --blue: #7aa2f7;
        /* Logo gold and navy, as in assets/icon.svg */
        --gold: #f0c46e;
        --gold-hi: #fff3cf;
        --gold-lo: #c38a37;
        --navy: #2b3f80;
        --navy-deep: #1b2552;
        --mono: 'cufflink Mono', ui-monospace, monospace;
        --sans: 'cufflink Sans', system-ui, sans-serif;
      }
      * {
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 100vw;
        height: 100vh;
        overflow: hidden;
      }
      body {
        position: relative;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 44px;
        background:
          /* Shirting pinstripe: a faint diagonal weave. */
          repeating-linear-gradient(135deg, rgba(122, 162, 247, 0.035) 0 1px, transparent 1px 14px),
          radial-gradient(ellipse 60% 80% at 50% 55%, #20233a 0%, transparent 70%),
          linear-gradient(180deg, var(--night) 0%, var(--night-deep) 100%);
        color: var(--fg);
        font-family: var(--sans);
      }
      /* A cuff seam along the left edge: a navy band with a gold stitch line. */
      .seam {
        position: absolute;
        inset: 0 auto 0 0;
        width: 22px;
        background: linear-gradient(90deg, var(--navy-deep), var(--navy));
      }
      .seam::after {
        content: '';
        position: absolute;
        top: 0;
        bottom: 0;
        right: 6px;
        border-right: 2px dashed rgba(240, 196, 110, 0.55);
      }
      .caption {
        display: none;
        margin: 0;
        text-align: center;
        font-size: 40px;
        line-height: 1.25;
        color: var(--fg);
      }
      .caption b {
        font-weight: 400;
        background: linear-gradient(
          135deg,
          var(--gold-hi) 0%,
          var(--gold) 40%,
          var(--gold-lo) 100%
        );
        -webkit-background-clip: text;
        background-clip: text;
        color: transparent;
      }
      @media (min-height: 700px) {
        .caption {
          display: block;
        }
      }
      .chat {
        width: 940px;
        margin-left: 22px;
      }
      .kicker {
        font-family: var(--mono);
        font-size: 20px;
        letter-spacing: 0.1em;
        text-transform: uppercase;
        margin: 0 0 10px 4px;
      }
      .before .kicker {
        color: var(--comment);
      }
      .after .kicker {
        color: var(--gold);
      }
      .msg {
        display: grid;
        grid-template-columns: 52px 1fr;
        gap: 18px;
        padding: 18px 26px;
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
      }
      .before .msg {
        opacity: 0.85;
      }
      .after .msg {
        border: 2px solid var(--gold);
        box-shadow:
          0 0 0 5px rgba(240, 196, 110, 0.1),
          0 18px 40px rgba(0, 0, 0, 0.45);
      }
      .avatar {
        width: 52px;
        height: 52px;
        border-radius: 10px;
        display: grid;
        place-items: center;
        font-family: var(--mono);
        font-size: 26px;
        color: var(--night);
        background: #9ece6a;
      }
      .who {
        font-size: 21px;
        color: var(--fg2);
      }
      .who b {
        font-weight: 400;
        color: var(--fg);
        margin-right: 10px;
      }
      .text {
        font-size: 29px;
        line-height: 1.35;
        color: var(--fg);
      }
      .text a {
        color: var(--blue);
        text-decoration: underline;
        text-decoration-thickness: 2px;
        text-underline-offset: 5px;
        text-decoration-color: rgba(122, 162, 247, 0.55);
      }
      .after .text a {
        font-family: var(--mono);
      }
      .press {
        display: flex;
        align-items: center;
        gap: 14px;
        margin: 16px 0 16px 74px;
        font-family: var(--mono);
        font-size: 21px;
        color: var(--fg2);
      }
      kbd {
        display: inline-block;
        min-width: 50px;
        padding: 6px 13px 8px;
        border-radius: 9px;
        font-family: var(--mono);
        font-size: 21px;
        text-align: center;
        color: var(--gold-hi);
        background: linear-gradient(180deg, #34488f, var(--navy-deep));
        border: 2px solid var(--gold);
        box-shadow: 0 3px 0 var(--gold-lo);
      }
    </style>
  </head>
  <body>
    <div class="seam"></div>
    <p class="caption">
      CuffLink <b>fastens</b> the key and title<br />to the links you copy with Alt+X.
    </p>
    <div class="chat">
      <div class="before">
        <div class="kicker">Before</div>
        <div class="msg">
          <div class="avatar">S</div>
          <div>
            <div class="who"><b>sam</b>10:42</div>
            <div class="text">
              Can you review this?<br /><a>https://github.com/octo-org/my-service/pull/42</a>
            </div>
          </div>
        </div>
      </div>
      <div class="press"><kbd>Alt</kbd>+<kbd>X</kbd><span>then paste</span></div>
      <div class="after">
        <div class="kicker">After</div>
        <div class="msg">
          <div class="avatar">S</div>
          <div>
            <div class="who"><b>sam</b>10:42</div>
            <div class="text">
              Can you review this?<br /><a>my-service#42 | Add retry to upload</a>
            </div>
          </div>
        </div>
      </div>
    </div>
  </body>
</html>
