<!doctype html>
<!--
  Made-up issue tracker page for the light card screenshot.
  Serve it at /browse/ABC-123/. Steps: "Refresh the README and store images" in CONTRIBUTING.md.
  A grey activity band and a thin frame give the light shot a visible edge on a white page.
-->
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>[ABC-123] Fix login timeout - Jira</title>
    <style>
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        background: #fff;
        color: #172b4d;
        font:
          14px/1.5 -apple-system,
          'Segoe UI',
          'Noto Sans',
          Helvetica,
          Arial,
          sans-serif;
      }
      header {
        height: 48px;
        border-bottom: 1px solid #dfe1e6;
        display: flex;
        align-items: center;
        padding: 0 24px;
        gap: 12px;
        color: #44546f;
      }
      .mark {
        width: 22px;
        height: 22px;
        border-radius: 4px;
        background: #0c66e4;
      }
      main {
        padding: 24px 40px;
        display: grid;
        grid-template-columns: 1fr 240px;
        gap: 32px;
      }
      .crumbs {
        color: #44546f;
        margin-bottom: 8px;
      }
      h1 {
        margin: 0 0 16px;
        font-size: 24px;
        font-weight: 500;
      }
      .label {
        font-weight: 600;
        margin: 0 0 6px;
      }
      .status {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 3px;
        background: #e9f2ff;
        color: #0055cc;
        font-weight: 600;
        font-size: 12px;
      }
      dl {
        margin: 12px 0 0;
      }
      dt {
        color: #44546f;
        font-size: 12px;
      }
      dd {
        margin: 0 0 12px;
      }
      .activity {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 104px;
        padding: 16px 40px;
        background: #f1f2f4;
        border-top: 1px solid #dfe1e6;
        color: #44546f;
      }
      .activity .label {
        color: #172b4d;
      }
      .reply {
        width: 46%;
        padding: 8px 12px;
        border: 1px solid #c1c7d0;
        border-radius: 4px;
        background: #fff;
        color: #626f86;
      }
      body::after {
        content: '';
        position: fixed;
        inset: 0;
        border: 1px solid #b3b9c4;
        pointer-events: none;
      }
      @media (max-width: 759px) {
        header {
          padding: 0 20px;
        }
        main {
          padding: 18px 20px;
          grid-template-columns: 1fr 150px;
          gap: 20px;
        }
        .activity {
          padding: 14px 20px;
        }
      }
    </style>
  </head>
  <body>
    <header>
      <div class="mark"></div>
      <span>Projects / ABC board</span>
    </header>
    <main>
      <div>
        <div class="crumbs">ABC / ABC-123</div>
        <h1 data-testid="issue.views.issue-base.foundation.summary.heading">Fix login timeout</h1>
        <p class="label">Description</p>
        <p>
          The login form gives up after 5 seconds on a slow network. Raise the limit and show a
          clear message when it runs out.
        </p>
      </div>
      <div>
        <span class="status">In progress</span>
        <dl>
          <dt>Assignee</dt>
          <dd>Alex Dev</dd>
          <dt>Priority</dt>
          <dd>Medium</dd>
        </dl>
      </div>
    </main>
    <section class="activity">
      <p class="label">Activity</p>
      <div class="reply">Add a comment…</div>
    </section>
  </body>
</html>
