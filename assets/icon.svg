<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>CuffLink</title>
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3cf"/>
      <stop offset="0.35" stop-color="#f0c46e"/>
      <stop offset="0.7" stop-color="#c38a37"/>
      <stop offset="1" stop-color="#8a5a1e"/>
    </linearGradient>
    <linearGradient id="enamel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a68c0"/>
      <stop offset="0.55" stop-color="#2b3f80"/>
      <stop offset="1" stop-color="#1b2552"/>
    </linearGradient>
    <!-- One link: a pill with a see-through slot. Local box 0..64 x 0..40. -->
    <mask id="hole" maskUnits="userSpaceOnUse" x="-8" y="-8" width="80" height="56">
      <rect x="-8" y="-8" width="80" height="56" fill="#fff"/>
      <rect x="20" y="15" width="24" height="10" rx="5" fill="#000"/>
    </mask>
    <g id="link">
      <g mask="url(#hole)">
        <rect x="0" y="0" width="64" height="40" rx="20" fill="url(#rim)"/>
        <rect x="6" y="6" width="52" height="28" rx="14" fill="url(#enamel)"/>
        <rect x="14" y="8" width="36" height="5" rx="2.5" fill="#fff" opacity="0.2"/>
      </g>
      <rect x="20" y="15" width="24" height="10" rx="5" fill="none" stroke="#f0c46e" stroke-width="2.5"/>
    </g>
    <!-- Top half of the overlap: the left link passes over the right link here. -->
    <clipPath id="over"><rect x="38" y="-10" width="32" height="30"/></clipPath>
  </defs>
  <!-- Left link, right link, then the left link again inside the clip, so the two interlock. -->
  <g transform="translate(64 64) rotate(-45) scale(1.16) translate(-53 -20)">
    <use href="#link"/>
    <use href="#link" x="42"/>
    <g clip-path="url(#over)"><use href="#link"/></g>
  </g>
</svg>
