<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 128 128" width="128" height="128">
  <title>CuffLink</title>
  <!-- Toolbar drawing for 16 and 32 px: the logo with larger links, a thicker navy band, a larger slot, no gloss and no slot bevel. A see-through gap shows where one link passes over the other. One unit is 1/8 px at 16 px. -->
  <defs>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fff3cf"/>
      <stop offset="0.35" stop-color="#f0c46e"/>
      <stop offset="0.7" stop-color="#c38a37"/>
      <stop offset="1" stop-color="#8a5a1e"/>
    </linearGradient>
    <linearGradient id="enamel" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#4a68c0"/>
      <stop offset="0.55" stop-color="#2b3f80"/>
      <stop offset="1" stop-color="#1b2552"/>
    </linearGradient>
    <!-- One link: a pill with a see-through slot. Local box 0..94 x 0..70. -->
    <mask id="hole" maskUnits="userSpaceOnUse" x="-8" y="-8" width="110" height="86">
      <rect x="-8" y="-8" width="110" height="86" fill="#fff"/>
      <rect x="21" y="27" width="52" height="16" rx="8" fill="#000"/>
    </mask>
    <g id="link">
      <g mask="url(#hole)">
        <rect x="0" y="0" width="94" height="70" rx="35" fill="url(#rim)" stroke="#6b4514" stroke-width="3"/>
        <rect x="10" y="10" width="74" height="50" rx="25" fill="url(#enamel)"/>
      </g>
    </g>
    <!-- Top and bottom halves of the overlap. -->
    <clipPath id="top"><rect x="50" y="-12" width="54" height="47"/></clipPath>
    <clipPath id="bottom"><rect x="50" y="35" width="54" height="47"/></clipPath>
    <!-- Top half: the left link passes over the right link, so cut a gap in the right link. -->
    <mask id="under-right" maskUnits="userSpaceOnUse" x="-20" y="-20" width="200" height="110">
      <rect x="-20" y="-20" width="200" height="110" fill="#fff"/>
      <g clip-path="url(#top)">
        <rect x="0" y="0" width="94" height="70" rx="35" fill="#000" stroke="#000" stroke-width="14"/>
        <rect x="21" y="27" width="52" height="16" rx="8" fill="#fff"/>
      </g>
    </mask>
    <!-- Bottom half: the right link passes over the left link, so cut a gap in the left link. -->
    <mask id="under-left" maskUnits="userSpaceOnUse" x="-20" y="-20" width="200" height="110">
      <rect x="-20" y="-20" width="200" height="110" fill="#fff"/>
      <g clip-path="url(#bottom)">
        <rect x="58" y="0" width="94" height="70" rx="35" fill="#000" stroke="#000" stroke-width="14"/>
        <rect x="79" y="27" width="52" height="16" rx="8" fill="#fff"/>
      </g>
    </mask>
  </defs>
  <g transform="translate(64 64) rotate(-45) translate(-76 -35)">
    <g mask="url(#under-right)"><use href="#link" x="58"/></g>
    <g mask="url(#under-left)"><use href="#link"/></g>
  </g>
</svg>
